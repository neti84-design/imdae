<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5efe7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="쏙">
  <meta name="description" content="흰머리만 골라 쏙 뽑는 힐링 앱">
  <title>쏙 — 흰머리 뽑기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 1. 홈 -->
  <section id="screen-home" class="screen">
    <button id="btn-settings" class="icon-btn corner" aria-label="설정">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.4 7.4 0 0 0-1.68-.98l-.36-2.54A.5.5 0 0 0 14.13 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.17.57-1.68.98l-2.39-.96a.5.5 0 0 0-.61.22L2.84 8.52a.5.5 0 0 0 .12.64l2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.51.41 1.08.74 1.68.98l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.6-.24 1.17-.57 1.68-.98l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"/></svg>
    </button>
    <div class="home-inner">
      <div class="logo">
        <svg viewBox="0 0 120 120" width="96" height="96" aria-hidden="true">
          <path d="M28 96 C 44 70, 58 52, 92 26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
          <ellipse cx="26" cy="99" rx="7" ry="5" fill="#fff" transform="rotate(-40 26 99)"/>
        </svg>
      </div>
      <h1 class="title">쏙</h1>
      <p class="tagline">흰머리 하나씩, 마음도 하나씩</p>
      <button id="btn-play" class="btn primary big">뽑으러 가기</button>
      <button id="btn-daily" class="btn soft"><span class="label">오늘의 한 판</span><span class="sub"></span></button>
      <p id="today-line" class="today-line"></p>
    </div>
  </section>

  <!-- 2. 플레이 -->
  <section id="screen-play" class="screen">
    <canvas id="stage" aria-label="머리 화면"></canvas>
    <div class="hud">
      <div class="pill remain"><span class="dot"></span>남은 흰머리 <b id="remain">0</b></div>
      <span id="mode-tag" class="mode-tag"></span>
      <button id="btn-pause" class="icon-btn" aria-label="일시정지">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
      </button>
    </div>
    <div id="style-bar" class="style-bar" role="radiogroup" aria-label="머리 스타일">
      <div id="style-list" class="style-list"></div>
      <button id="style-fold" class="style-fold" aria-label="스타일 접기">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="tissue" aria-label="뽑은 흰머리"><canvas id="tissue-canvas"></canvas></div>

    <div id="hint" class="hint" hidden>
      <div class="hint-card">
        <p><b>한 손가락</b>으로 쓸면 머리카락을 뒤적여요</p>
        <p><b>두 손가락</b>으로 확대·이동</p>
        <p>흰머리 위에서 <b>꾹 누르거나 멈추면</b> 핀셋으로 집혀요</p>
        <p>바깥쪽으로 <b>천천히</b> 당기면 뿌리째 쏙</p>
        <span class="hint-tap">화면을 만지면 시작해요</span>
      </div>
    </div>

    <div id="pause-menu" class="overlay" hidden>
      <div class="sheet">
        <h2>잠깐 쉬어요</h2>
        <p class="muted">지금 상태 그대로 저장돼요</p>
        <button id="btn-resume" class="btn primary">계속하기</button>
        <button id="btn-quit" class="btn soft">홈으로</button>
      </div>
    </div>

    <!-- 3. 완료 -->
    <div id="done" class="overlay done" hidden>
      <div class="sheet">
        <div class="sparkle">✦</div>
        <h2>개운해졌어요</h2>
        <p class="done-stats"><b id="done-count">0</b>개 뽑았어요 · 뿌리째 <b id="done-root">0</b>%</p>
        <p id="done-extra" class="muted"></p>
        <button id="btn-again" class="btn primary">한 판 더</button>
        <button id="btn-stop" class="btn soft">그만하기</button>
      </div>
    </div>
  </section>

  <!-- 4. 설정 -->
  <section id="screen-settings" class="screen">
    <header class="bar">
      <button id="btn-settings-back" class="icon-btn" aria-label="뒤로">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2>설정</h2>
    </header>
    <div class="settings">
      <div class="row col">
        <span>진동 세기</span>
        <div id="vib-seg" class="seg">
          <button data-v="off">끄기</button>
          <button data-v="weak">약하게</button>
          <button data-v="normal">보통</button>
          <button data-v="strong">강하게</button>
        </div>
        <small id="vib-note" class="muted"></small>
      </div>
      <label class="row">
        <span>소리 <small class="muted">"틱" 하고 빠지는 소리</small></span>
        <input id="opt-sound" type="checkbox" class="toggle">
      </label>
      <label class="row">
        <span>알림 <small class="muted">하루 1회 "오늘 머리 정리할까요?" · 앱 버전에서 동작</small></span>
        <input id="opt-notify" type="checkbox" class="toggle">
      </label>
      <button id="btn-reset" class="btn text">기록 초기화</button>
    </div>
  </section>

</div>
<script src="js/feedback.js"></script>
<script src="js/styles.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
